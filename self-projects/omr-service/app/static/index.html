<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0e1116" />
    <title>Chấm phiếu trắc nghiệm</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <style>
      :root {
        --bg: #0e1116;
        --surface: #171b22;
        --surface2: #1f242d;
        --line: #2a303a;
        --text: #e6e9ef;
        --muted: #8b94a3;
        --accent: #3b82f6;
        --ok: #22c55e;
        --bad: #ef4444;
        --warn: #eab308;
        --header: 54px;
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- header + menu ---------- */
      #header {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 20;
        height: calc(var(--header) + var(--safe-t));
        padding-top: var(--safe-t);
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 8px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      body.on-scan #header {
        background: transparent;
        border-color: transparent;
        pointer-events: none;
      }
      #menuBtn {
        pointer-events: auto;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: grid;
        place-items: center;
      }
      body.on-scan #menuBtn {
        background: rgba(14, 17, 22, 0.65);
      }
      #menuBtn svg {
        width: 22px;
        height: 22px;
        stroke: var(--text);
      }
      #title {
        font-weight: 600;
      }
      body.on-scan #title {
        display: none;
      }
      #menu {
        position: fixed;
        z-index: 30;
        left: 8px;
        top: calc(var(--header) + var(--safe-t) - 4px);
        min-width: 200px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 6px;
      }
      #menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border-radius: 8px;
      }
      #menu button.active {
        background: var(--surface2);
        color: var(--accent);
      }
      #scrim {
        position: fixed;
        inset: 0;
        z-index: 25;
      }

      /* ---------- pages ---------- */
      .page {
        position: fixed;
        inset: calc(var(--header) + var(--safe-t)) 0 0 0;
        overflow-y: auto;
        padding: 12px 12px 96px;
      }
      #page-scan {
        inset: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      .empty {
        margin-top: 30vh;
        text-align: center;
        color: var(--muted);
      }

      /* ---------- list rows ---------- */
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: var(--surface);
        border-radius: 12px;
        padding: 12px 8px 12px 14px;
        margin-bottom: 8px;
      }
      .row .main {
        flex: 1;
        min-width: 0;
      }
      .row .t {
        font-weight: 600;
      }
      .row .s {
        color: var(--muted);
        font-size: 13px;
      }
      .row .side {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
        white-space: nowrap;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--muted);
        flex: none;
      }
      .icon-btn:active {
        background: var(--surface2);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }
      .fab {
        position: fixed;
        right: 16px;
        bottom: calc(20px + var(--safe-b));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        z-index: 10;
      }
      .fab svg {
        width: 26px;
        height: 26px;
        stroke: #fff;
      }

      /* ---------- scan page ---------- */
      #video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      #guide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #hint {
        position: absolute;
        left: 12px;
        right: 12px;
        text-align: center;
        font-size: 14px;
        color: #fff;
        text-shadow: 0 1px 3px #000;
      }
      #shutter {
        position: absolute;
        left: 50%;
        bottom: calc(26px + var(--safe-b));
        transform: translateX(-50%);
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 4px solid #fff;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.25);
        transition: opacity 0.15s;
      }
      #shutter[hidden] {
        display: none;
      }
      #shutter i {
        display: block;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #fff;
        transition: background 0.15s;
      }
      #shutter:disabled {
        opacity: 0.35;
      }
      #shutter:disabled i {
        background: #9aa0a8;
      }
      #camMsg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        background: var(--bg);
      }
      #busy {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }
      .spin {
        width: 34px;
        height: 34px;
        border: 3px solid #444;
        border-top-color: #fff;
        border-radius: 50%;
        animation: sp 0.8s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- buttons / modal ---------- */
      .btn {
        padding: 11px 18px;
        border-radius: 10px;
        background: var(--surface2);
        font-weight: 600;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
      }
      .btn.danger {
        background: var(--bad);
        color: #fff;
      }
      .btn:active {
        opacity: 0.8;
      }
      .modal-wrap {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .modal {
        width: 100%;
        max-width: 560px;
        max-height: 92vh;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-radius: 16px 16px 0 0;
        padding-bottom: var(--safe-b);
      }
      @media (min-width: 600px) {
        .modal-wrap {
          align-items: center;
        }
        .modal {
          border-radius: 16px;
          max-height: 88vh;
        }
      }
      .modal h2 {
        font-size: 17px;
        padding: 16px 18px 8px;
      }
      .modal .body {
        padding: 6px 18px 12px;
        overflow-y: auto;
        flex: 1;
      }
      .modal .foot {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
        padding: 10px 18px 16px;
        flex-wrap: wrap;
      }
      .modal .foot .msg {
        flex: 1 0 100%;
        color: var(--bad);
        font-size: 13px;
      }

      /* ---------- result view ---------- */
      .kv {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .kv div {
        background: var(--surface2);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .kv small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .kv b {
        font-size: 18px;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      .orange {
        color: #f97316;
      }
      .sec-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin: 4px 0 6px;
      }
      .when {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .imgbox {
        overflow: auto;
        border-radius: 10px;
        background: #fff;
        max-height: 50vh;
      }
      .imgbox img {
        display: block;
        width: 100%;
        cursor: zoom-in;
      }
      .imgbox img.zoom {
        width: 240%;
        cursor: zoom-out;
      }
      .errlist {
        list-style: none;
        display: grid;
        gap: 8px;
      }
      .errlist li {
        background: var(--surface2);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .dl {
        margin: -2px 0 12px;
        background: var(--surface2);
        border-radius: 10px;
        padding: 4px 10px;
        font-size: 13px;
      }
      .dl div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 0;
      }
      .dl div + div {
        border-top: 1px solid var(--line);
      }
      .dl .sum {
        font-weight: 700;
      }
      .total {
        background: var(--surface2);
        border-radius: 12px;
        padding: 12px;
        margin: 4px 0 12px;
        text-align: center;
      }
      .total small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .total b {
        font-size: 26px;
      }
      .total .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      a.btn {
        display: inline-block;
        text-decoration: none;
        text-align: center;
      }
      .tpl {
        padding: 24px 8px;
        text-align: center;
        color: var(--muted);
      }
      .tpl p {
        margin-bottom: 16px;
        line-height: 1.5;
      }

      /* ---------- answer-key form ---------- */
      .field label {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 4px;
      }
      .field input[type="text"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--text);
        font: inherit;
        letter-spacing: 3px;
        font-size: 18px;
      }
      .field input.invalid {
        border-color: var(--bad);
      }
      .field input.num {
        letter-spacing: 0;
        font-size: 16px;
      }
      .cfg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 6px 0 10px;
      }
      .cfg .full {
        grid-column: 1 / -1;
      }
      .cfg.four {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 0;
      }
      .cfg .field input {
        min-width: 0;
      }
      .q[hidden],
      .tfq[hidden] {
        display: none;
      }
      .kv.one {
        grid-template-columns: 1fr;
      }
      .sec-score {
        color: var(--text);
        font-weight: 700;
      }
      .sec {
        margin: 16px 0 6px;
        font-weight: 600;
        font-size: 14px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 4px;
      }
      @media (min-width: 520px) {
        .grid.two {
          grid-template-columns: 1fr 1fr;
          column-gap: 16px;
        }
      }
      .q {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 6px;
        border-radius: 8px;
        border-left: 3px solid transparent;
      }
      .q.invalid {
        border-left-color: var(--bad);
        background: rgba(239, 68, 68, 0.08);
      }
      .q .n {
        width: 34px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .opts {
        display: flex;
        gap: 6px;
        flex: 1;
      }
      .opts label {
        flex: 1;
      }
      .opts input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .opts span {
        display: block;
        text-align: center;
        padding: 7px 0;
        border-radius: 8px;
        background: var(--surface2);
        font-weight: 600;
      }
      .opts input:checked + span {
        background: var(--accent);
        color: #fff;
      }
      .tfq {
        margin-top: 10px;
      }
      .tfq h4 {
        font-size: 14px;
        margin-bottom: 4px;
      }

      /* ---------- toast ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(110px + var(--safe-b));
        transform: translateX(-50%);
        z-index: 80;
        background: var(--surface2);
        border: 1px solid var(--line);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        max-width: 90%;
      }

      .seg {
        display: flex;
        gap: 4px;
        padding: 4px;
        margin-bottom: 12px;
        background: var(--surface);
        border-radius: 12px;
      }
      .seg button {
        flex: 1;
        padding: 9px 0;
        border-radius: 9px;
        font-weight: 600;
        color: var(--muted);
      }
      .seg button.on {
        background: var(--surface2);
        color: var(--accent);
      }
      .import-card {
        display: grid;
        gap: 16px;
        background: var(--surface);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .import-card .step {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .import-card .no {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--surface2);
        color: var(--accent);
        font-weight: 700;
      }
      .import-card .txt {
        flex: 1;
        display: grid;
        gap: 2px;
        font-size: 14px;
      }
      .import-card .txt small {
        color: var(--muted);
        font-size: 12px;
      }
      .import-card .txt .btn {
        justify-self: start;
        margin-top: 8px;
      }
      .fab[hidden] {
        display: none;
      }
      .err-group + .err-group {
        margin-top: 12px;
      }

      .modal .seg {
        background: var(--surface2);
        border: 1px solid var(--line);
      }
      .modal .seg button.on {
        background: var(--line);
        color: var(--accent);
      }
      .modal .import-card {
        background: var(--surface2);
        border: 1px solid var(--line);
        margin-bottom: 0;
      }
      .modal .import-card .no {
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .modal .import-card .btn:not(.primary) {
        background: var(--line);
        border: 1px solid #3a4150;
        color: var(--text);
      }
    </style>
  </head>
  <body class="on-scan">
    <div id="header">
      <button id="menuBtn" aria-label="Menu">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <span id="title"></span>
    </div>
    <div id="scrim" hidden></div>
    <div id="menu" hidden>
      <button data-page="scan">Quét bài</button>
      <button data-page="history">Kho lưu trữ</button>
      <button data-page="keys">Nhập đáp án</button>
      <button data-page="template">Mẫu phiếu</button>
    </div>

    <section class="page" id="page-scan">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="guide"></canvas>
      <div id="hint"></div>
      <button id="shutter" disabled aria-label="Chụp"><i></i></button>
      <div id="camMsg" hidden>
        <div id="camMsgText"></div>
        <button class="btn primary" id="camRetry">Thử lại</button>
      </div>
      <div id="busy" hidden>
        <div class="spin"></div>
        <div>Đang xử lý…</div>
      </div>
    </section>

    <section class="page" id="page-history" hidden>
      <div id="historyList"></div>
    </section>

    <section class="page" id="page-keys" hidden>
      <div id="keysList"></div>
      <button class="fab" id="addKey" aria-label="Thêm đáp án">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.4"
          stroke-linecap="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </section>

    <section class="page" id="page-template" hidden>
      <div class="tpl">
        <p>Tải phiếu trả lời mẫu để in cho học sinh.</p>
        <a class="btn primary" href="template.pdf" download="Mau-phieu.pdf"
          >Tải mẫu phiếu (PDF)</a
        >
      </div>
    </section>

    <div id="toast" hidden></div>

    <script>
      "use strict";
      const API_BASE = window.OMR_API_BASE || "";
      const LS_KEYS = "omr.keys.v1";
      const LS_HISTORY = "omr.history.v1";

      let LAYOUT = {
        corner_markers: [
          [49.0, 109.9],
          [553.0, 109.9],
          [48.9, 368.0],
          [553.5, 368.0],
        ], // TL, TR, BL, BR
        corner_marker_size: 15.0,
        capture_region: [33.0, 94.0, 570.0, 384.0],
        multiple_choice_questions: Array.from({ length: 20 }, (_, i) => i + 1),
        true_false_questions: [1, 2, 3, 4],
        true_false_rows: ["a", "b", "c", "d"],
        exam_code_length: 3,
      };

      const $ = (s, r = document) => r.querySelector(s);
      const el = (tag, attrs = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") e.className = v;
          else if (k === "html") e.innerHTML = v;
          else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        }
        for (const c of kids.flat())
          if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
        return e;
      };
      const ICON_TRASH =
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

      const pad = (n) => String(n).padStart(2, "0");
      function fmtTime(d) {
        // HH:mm:ss DD/MM/YYYY
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
      }
      function readLS(key) {
        try {
          const v = JSON.parse(localStorage.getItem(key) || "[]");
          return Array.isArray(v) ? v : [];
        } catch {
          return [];
        }
      }
      function writeLS(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
          return true;
        } catch (e) {
          toast(
            "Bộ nhớ trình duyệt đã đầy. Hãy xóa bớt kết quả cũ trong Kho lưu trữ.",
          );
          return false;
        }
      }
      const loadKeys = () => readLS(LS_KEYS);
      const loadHistory = () => readLS(LS_HISTORY);
      let toastTimer;
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.hidden = true), 3200);
      }

      function openModal({ title, body, actions = [], onClose }) {
        const msg = el("div", { class: "msg", hidden: "" });
        const foot = el("div", { class: "foot" }, msg);
        const wrap = el(
          "div",
          { class: "modal-wrap" },
          el(
            "div",
            { class: "modal", role: "dialog" },
            title ? el("h2", {}, title) : null,
            el("div", { class: "body" }, body),
            foot,
          ),
        );
        const api = {
          el: wrap,
          msg: (t) => {
            msg.textContent = t || "";
            msg.hidden = !t;
          },
          close() {
            wrap.remove();
            onClose && onClose();
          },
        };
        for (const a of actions) {
          foot.append(
            el(
              "button",
              {
                class: "btn " + (a.kind || ""),
                onclick: () => {
                  if (a.onClick?.(api) !== false) api.close();
                },
              },
              a.text,
            ),
          );
        }
        document.body.append(wrap);
        return api;
      }
      function confirmDialog(text, okText, onOk) {
        openModal({
          title: text,
          body: el("div"),
          actions: [
            { text: "Hủy" },
            {
              text: okText,
              kind: "danger",
              onClick: () => {
                onOk();
              },
            },
          ],
        });
      }

      const PAGES = {

        history: "Kho lưu trữ",
        keys: "Nhập đáp án",

      function toggleMenu(show) {
        $("#menu").hidden = !show;
        $("#scrim").hidden = !show;
      }
      $("#menuBtn").onclick = () => toggleMenu($("#menu").hidden);
      $("#scrim").onclick = () => toggleMenu(false);
      $("#menu").addEventListener("click", (e) => {

        if (!b) return;
        toggleMenu(false);
        go(b.dataset.page);

      function go(page) {
        currentPage = page;
        for (const p of Object.keys(PAGES)) $("#page-" + p).hidden = p !== page;
        document.body.classList.toggle("on-scan", page === "scan");
        $("#title").textContent = PAGES[page];
        for (const b of $("#menu").querySelectorAll("button"))
          b.classList.toggle("active", b.dataset.page === page);
        if (page === "scan") Camera.start();
        else Camera.stop();
        if (page === "history") renderHistory();
        if (page === "keys") renderKeys();
      }

      function resultView(rec) {
        const s = rec.summary || {},
          sc = rec.scores;
        const idTxt = rec.student_id ?? (rec.student_raw || "?") + " (chưa rõ)";
        const kv = (label, val, cls = "") =>
          el(
            "div",
            {},
            el("small", {}, label),
            el("b", { class: cls }, String(val)),
          );
        const grid = el(
          "div",
          { class: "kv" },
          kv("SBD", idTxt, rec.student_id ? "" : "warn"),
          kv("Mã đề", rec.exam_code ?? "?"),
          kv("Tổng số câu", s.total ?? 0),
        );
        const stats = (grp) => {
          const st = { total: 0, correct: 0, wrong: 0, blank: 0 };
          for (const a of rec.answers || [])
            if (a.g === grp) {
              st.total++;
              if (a.r in st) st[a.r]++;
            }
          return st;
        };
        const tfPerQuestion = () => {
          const m = new Map();
          for (const a of rec.answers || [])
            if (a.g === "TF") {
              const o = m.get(a.n) || { ok: 0, all: 0 };
              o.all++;
              if (a.r === "correct") o.ok++;
              m.set(a.n, o);
            }
          return [...m.entries()].sort((a, b) => a[0] - b[0]);
        };
        const detail = (rows) =>
          el(
            "div",
            { class: "dl" },
            rows.map(([l, r, cls]) =>
              el(
                "div",
                { class: cls === "sum" ? "sum" : "" },
                el("span", {}, l),
                el("b", {}, r),
              ),
            ),
          );
        const section = (title, st, part, rows) =>
          el(
            "div",
            {},
            el(
              "div",
              { class: "sec-title" },
              el("span", {}, `${title} (${st.total} câu)`),
              part
                ? el(
                    "span",
                    { class: "sec-score" },
                    `${fmtScore(part.score)}/${fmtScore(part.max)} điểm`,
                  )
                : null,
            ),
            el(
              "div",
              { class: "kv" },
              kv("Đúng", st.correct, "ok"),
              kv("Sai", st.wrong, "bad"),
              kv("Bỏ trống", st.blank, "orange"),
            ),
            part ? detail(rows) : null,
          );

        const mcSt = stats("MC"),
          mcPart = sc?.multiple_choice,
          tfPart = sc?.true_false;
        const mcRows = mcPart
          ? [
              [
                `Đúng ${mcSt.correct}/${mcSt.total} câu × ${fmtScore(mcPart.max)} điểm`,
                `= ${fmtScore(mcPart.score)}`,
              ],
            ]
          : [];
        const tfRows = tfPart
          ? [
              ...tfPerQuestion().map(([n, o]) => [
                `Câu ${n}: đúng ${o.ok}/${o.all} ý`,
                `${fmtScore(tfPart.by_question?.[n]?.score ?? 0)} điểm`,
              ]),
            ]
          : [];

        const box = [
          grid,
          section("Phần 1: Trắc nghiệm", mcSt, mcPart, mcRows),
          section("Phần 2: Đúng / Sai", stats("TF"), tfPart, tfRows),
          sc
            ? el(
                "div",
                { class: "total" },
                el("small", {}, "ĐIỂM TỔNG"),
                el(
                  "b",
                  { class: "ok" },
                  `${fmtScore(sc.total.score)} / ${fmtScore(sc.total.max)}`,
                ),
              )
            : null,
        ].filter(Boolean);
        if ((s.needs_review || 0) > 0)
          box.push(
            el(
              "p",
              { class: "warn", style: "margin-bottom:10px" },
              `Có ${s.needs_review} câu cần kiểm tra lại (màu vàng).`,
            ),
          );
        if (rec.time) box.unshift(el("div", { class: "when" }, rec.time));
        if (rec.image) {
          const img = el("img", { src: rec.image, alt: "Kết quả chấm" });
          img.onclick = () => img.classList.toggle("zoom");
          box.push(el("div", { class: "imgbox" }, img));
        }
        return el("div", {}, box);
      }

      $("#addKey").onclick = () => openKeyForm(null);

      // ---------- Excel template / import ----------
      const MAX_TEMPLATE_EXAMS = 50; // keep in sync with MAX_EXAM_SHEETS on the server

      // Bulk insert/overwrite. Re-inserting moves a key to the end, so the last
      // imported exam becomes the "most recent" source of default config.
      function upsertKeys(list) {
        const byCode = new Map(loadKeys().map((k) => [k.exam_code, k]));
        let added = 0,
          replaced = 0;
        for (const k of list) {
          if (byCode.delete(k.exam_code)) replaced++;
          else added++;
          byCode.set(k.exam_code, k);
        }
        return writeLS(LS_KEYS, [...byCode.values()])
          ? { added, replaced }
          : null;
      }

      const stamp = (d = new Date()) =>
        `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;

      async function downloadTemplate(examCount, config) {
        let res;
        try {
          res = await fetch(API_BASE + "/api/answer-keys/template", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ exam_count: examCount, config }),
          });
        } catch {
          throw new Error(
            "Không kết nối được máy chủ. Kiểm tra kết nối mạng rồi thử lại.",
          );
        }
        if (!res.ok) {
          let msg = "Không tạo được tệp mẫu. Vui lòng thử lại.";
          try {
            const env = await res.json();
            const m = (env.error?.errors || []).map((e) => e.message);
            if (m.length) msg = m.join(" ");
          } catch {}
          throw new Error(msg);
        }
        const url = URL.createObjectURL(await res.blob());
        // timestamp in the file name so repeated downloads never collide
        const a = el("a", {
          href: url,
          download: `mau-dap-an-${stamp()}.xlsx`,
        });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      function openTemplateDialog() {
        const maxMc = LAYOUT.multiple_choice_questions.length,
          maxTf = LAYOUT.true_false_questions.length;
        const cfg0 = defaultKeyConfig(null); // same defaults as the manual form
        const examCount = numInput(1, 2, "numeric"),
          mcCount = numInput(cfg0.mc_count, String(maxMc).length, "numeric"),
          tfCount = numInput(cfg0.tf_count, String(maxTf).length, "numeric"),
          mcPts = numInput(fmtNum(cfg0.mc_points), 5, "decimal"),
          tfPts = cfg0.tf_points.map((p) => numInput(fmtNum(p), 5, "decimal"));
        limitInt(examCount, 1, MAX_TEMPLATE_EXAMS);
        limitInt(mcCount, 1, maxMc);
        limitInt(tfCount, 1, maxTf);
        limitPts(mcPts);
        tfPts.forEach(limitPts);

        const body = el(
          "div",
          {},
          el(
            "div",
            { class: "cfg" },
            cfgField(
              `Số lượng mã đề (1-${MAX_TEMPLATE_EXAMS})`,
              examCount,
              true,
            ),
          ),
          el("div", { class: "sec" }, "Trắc nghiệm"),
          el(
            "div",
            { class: "cfg" },
            cfgField(`Số câu (1-${maxMc})`, mcCount),
            cfgField("Tổng điểm", mcPts),
          ),
          el("div", { class: "sec" }, "Đúng / Sai"),
          el(
            "div",
            { class: "cfg" },
            cfgField(`Số câu (1-${maxTf})`, tfCount, true),
          ),
          el(
            "div",
            { class: "sec-title" },
            el("span", {}, "Điểm mỗi câu theo số ý đúng"),
          ),
          el(
            "div",
            { class: "cfg four" },
            tfPts.map((inp, i) => cfgField(`Đúng ${i + 1} ý`, inp)),
          ),
        );

        const points = (input) => {
          const s = input.value.trim(),
            v = parseNum(s);
          return PTS_RE.test(s) && v > 0 && v <= 10
            ? Math.round(v * 100) / 100
            : null;
        };
        let sending = false;
        const modal = openModal({
          title: "Tải tệp mẫu Excel",
          body,
          actions: [
            { text: "Hủy" },
            {
              text: "Tải xuống",
              kind: "primary",
              onClick: (api) => {
                if (sending) return false;
                for (const i of body.querySelectorAll("input.invalid"))
                  i.classList.remove("invalid");
                const n = parseInt(examCount.value, 10),
                  mc = parseInt(mcCount.value, 10),
                  tf = parseInt(tfCount.value, 10);
                const ptsInputs = [mcPts, ...tfPts],
                  pv = ptsInputs.map(points);
                const bad = [];
                if (!(n >= 1 && n <= MAX_TEMPLATE_EXAMS)) bad.push(examCount);
                if (!(mc >= 1 && mc <= maxMc)) bad.push(mcCount);
                if (!(tf >= 1 && tf <= maxTf)) bad.push(tfCount);
                ptsInputs.forEach((inp, i) => pv[i] === null && bad.push(inp));
                if (bad.length) {
                  for (const i of bad) i.classList.add("invalid");
                  api.msg("Vui lòng kiểm tra lại các ô được đánh dấu đỏ.");
                  return false;
                }
                sending = true;
                downloadTemplate(n, {
                  mc_count: mc,
                  mc_points: pv[0],
                  tf_count: tf,
                  tf_points: pv.slice(1),
                })
                  .then(() => {
                    api.close();
                    toast("Đã tải tệp mẫu.");
                  })
                  .catch((e) => api.msg(e.message))
                  .finally(() => (sending = false));
                return false; // keep the dialog open until the download finishes
              },
            },
          ],
        });
        body.addEventListener("input", (e) => {
          e.target.classList.remove("invalid");
          modal.msg("");
        });
      }

      function showImportError(title, errors, pick) {
        // group by sheet; the "[sheet] " prefix is redundant inside a group
        const groups = new Map();
        for (const e of errors) {
          const key = e.sheet || "";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(String(e.message).replace(/^\[[^\]]+\]\s*/, ""));
        }
        openModal({
          title,
          body: el(
            "div",
            {},
            el(
              "p",
              { style: "margin-bottom:10px" },
              `Phát hiện ${errors.length} lỗi. Hãy sửa lại tệp Excel rồi tải lên lại.`,
            ),
            [...groups].map(([sheet, msgs]) =>
              el(
                "div",
                { class: "err-group" },
                sheet
                  ? el("div", { class: "sec-title" }, el("span", {}, sheet))
                  : null,
                el(
                  "ul",
                  { class: "errlist" },
                  msgs.map((m) => el("li", {}, m)),
                ),
              ),
            ),
          ),
          actions: [
            { text: "Đóng" },
            { text: "Chọn tệp khác", kind: "primary", onClick: () => pick() },
          ],
        });
      }

      // ctx: { modal: the "Thêm đáp án" dialog, pick: open file picker, button: import button }
      async function importKeyFile(file, { modal, pick, button }) {
        if (!file) return;
        button.disabled = true;
        try {
          let env;
          try {
            const fd = new FormData();
            fd.append("file", file, file.name);
            const res = await fetch(API_BASE + "/api/answer-keys/import", {
              method: "POST",
              body: fd,
            });
            env = await res.json();
          } catch {
            return toast(
              "Không kết nối được máy chủ. Kiểm tra kết nối mạng rồi thử lại.",
            );
          }
          if (!env?.success) {
            const errs = env?.error?.errors || [];
            return showImportError(
              env?.error?.title || "Tệp Excel không hợp lệ",
              errs.length
                ? errs
                : [{ message: "Đã xảy ra lỗi. Vui lòng thử lại." }],
              pick,
            );
          }
          const r = upsertKeys(env.result.exams);
          if (!r) return;
          modal.close();
          renderKeys();
          toast(
            r.replaced
              ? `Đã tải lên ${env.result.count} mã đề (${r.added} thêm mới, ${r.replaced} ghi đè).`
              : `Đã tải lên ${env.result.count} mã đề.`,
          );
        } finally {
          button.disabled = false;
        }
      }

        const fileInput = el("input", {

          step(
            2,

      const fmtNum = (v) => String(v).replace(".", ",");
      const parseNum = (s) => Number(String(s).trim().replace(",", "."));
      const PTS_RE = /^\d{1,2}([.,]\d{1,2})?$/;
      const fmtScore = (n) =>
        String(Math.round((Number(n) || 0) * 100) / 100).replace(".", ",");

      function defaultKeyConfig(existing) {
        const maxMc = LAYOUT.multiple_choice_questions.length,
          maxTf = LAYOUT.true_false_questions.length;
        const src =
          existing?.config ||
          [...loadKeys()].reverse().find((k) => k.config)?.config ||
          {};
        let mc = src.mc_count,
          tf = src.tf_count;
        if (existing && !existing.config) {
          mc = Object.keys(existing.multiple_choice || {}).length || mc;
          tf = Object.keys(existing.true_false || {}).length || tf;
        }
        return {
          mc_count: mc || maxMc,
          tf_count: tf || maxTf,
          mc_points: src.mc_points ?? 6,
          tf_points: src.tf_points ?? [0.1, 0.25, 0.5, 1],
        };
      }

      const numInput = (value, maxlen, mode) =>
        el("input", {
          type: "text",
          inputmode: mode,
          maxlength: String(maxlen),
          autocomplete: "off",
          class: "num",
          value: String(value),
        });
      const limitInt = (input, min, max) => {
        let prev = input.value;
        input.addEventListener("input", () => {
          let v = input.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
          if (v !== "" && Number(v) > max) v = prev;
          input.value = prev = v;
        });
        input.addEventListener("blur", () => {
          if (input.value === "" || Number(input.value) < min)
            input.value = prev = String(min);
        });
      };
      const limitPts = (input) => {
        const init = input.value;
        let prev = init;
        const ok = (s) =>
          /^\d{0,2}([.,]\d{0,2})?$/.test(s) && !(parseNum(s) > 10);
        input.addEventListener("input", () => {
          let s = input.value.replace(/[^\d.,]/g, "");
          if (!ok(s)) s = prev;
          input.value = prev = s;
        });
        input.addEventListener("blur", () => {
          let s = input.value.replace(/[.,]$/, "");
          if (/^[.,]/.test(s)) s = "0" + s;
          input.value = prev = s !== "" && parseNum(s) > 0 ? s : init;
        });
      };
      const cfgField = (label, input, full = false) =>
        el(
          "div",
          { class: full ? "field full" : "field" },
          el("label", {}, label),
          input,
        );

      function radioGroup(name, values, labels, checked) {
        return el(
          "div",
          { class: "opts" },
          values.map((v, i) =>
            el(
              "label",
              {},
              el("input", {
                type: "radio",
                name,
                value: v,
                ...(checked === v ? { checked: "" } : {}),
              }),
              el("span", {}, labels[i]),
            ),
          ),
        );
      }
      function openKeyForm(editCode) {
        const existing = editCode
          ? loadKeys().find((k) => k.exam_code === editCode)
          : null;
        const L = LAYOUT,
          rows = L.true_false_rows;
        const maxMc = L.multiple_choice_questions.length,
          maxTf = L.true_false_questions.length;
        const cfg0 = defaultKeyConfig(existing);

        const codeInput = el("input", {
          type: "text",
          inputmode: "numeric",
          maxlength: String(L.exam_code_length),
          autocomplete: "off",
          placeholder: "0".repeat(L.exam_code_length),
          value: existing ? existing.exam_code : "",
        });
        codeInput.addEventListener("input", () => {
          codeInput.value = codeInput.value
            .replace(/\D/g, "")
            .slice(0, L.exam_code_length);
        });
        const mcCount = numInput(
            cfg0.mc_count,
            String(maxMc).length,
            "numeric",
          ),
          tfCount = numInput(cfg0.tf_count, String(maxTf).length, "numeric"),
          mcPts = numInput(fmtNum(cfg0.mc_points), 5, "decimal"),
          tfPts = cfg0.tf_points.map((p) => numInput(fmtNum(p), 5, "decimal"));
        limitInt(mcCount, 1, maxMc);
        limitInt(tfCount, 1, maxTf);
        limitPts(mcPts);
        tfPts.forEach(limitPts);

        const mcQs = L.multiple_choice_questions.map((n) =>
          el(
            "div",
            { class: "q", "data-key": "mc" + n },
            el("span", { class: "n" }, String(n)),
            radioGroup(
              "mc" + n,
              ["A", "B", "C", "D"],
              ["A", "B", "C", "D"],
              existing?.multiple_choice?.[n],

      function detectSquare(gray, N, expectedPx, boxPx) {
        // Otsu
        const hist = new Array(256).fill(0);
        for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
        let sum = 0;
        for (let i = 0; i < 256; i++) sum += i * hist[i];
        let wB = 0,
          sumB = 0,
          best = -1,
          thr = 128;
        for (let t = 0; t < 256; t++) {
          wB += hist[t];
          if (!wB) continue;
          const wF = gray.length - wB;
          if (!wF) break;
          sumB += t * hist[t];
          const mB = sumB / wB,
            mF = (sum - sumB) / wF,
            v = wB * wF * (mB - mF) * (mB - mF);
          if (v > best) {
            best = v;
            thr = t;
          }
        }
        let acc = 0,
          bg = 128;
        for (let i = 0; i < 256; i++) {
          acc += hist[i];
          if (acc >= gray.length / 2) {
            bg = i;
            break;
          }
        }
        thr = bg - Math.max(12, bg * 0.12);
        let sd = 0,
          nd = 0;
        for (let i = 0; i < gray.length; i++)
          if (gray[i] <= thr) {
            sd += gray[i];
            nd++;
          }
        if (!nd || bg - sd / nd < 12) return null;
        const dark = new Uint8Array(N * N);
        for (let i = 0; i < gray.length; i++) dark[i] = gray[i] <= thr ? 1 : 0;
        const c0 = (N - 1) / 2,
          bh = boxPx / 2;
        const seen = new Uint8Array(N * N),
          stack = [];
        let bestBlob = null,
          bestScore = 1e9;
        for (let s = 0; s < N * N; s++) {
          if (!dark[s] || seen[s]) continue;
          let minX = N,
            minY = N,
            maxX = -1,
            maxY = -1,
            area = 0,
            sx = 0,
            sy = 0;
          stack.push(s);
          seen[s] = 1;
          while (stack.length) {
            const p = stack.pop(),
              x = p % N,
              y = (p - x) / N;
            area++;
            sx += x;
            sy += y;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            if (x > 0 && dark[p - 1] && !seen[p - 1]) {
              seen[p - 1] = 1;
              stack.push(p - 1);
            }
            if (x < N - 1 && dark[p + 1] && !seen[p + 1]) {
              seen[p + 1] = 1;
              stack.push(p + 1);
            }
            if (y > 0 && dark[p - N] && !seen[p - N]) {
              seen[p - N] = 1;
              stack.push(p - N);
            }
            if (y < N - 1 && dark[p + N] && !seen[p + N]) {
              seen[p + N] = 1;
              stack.push(p + N);
            }
          }
          const w = maxX - minX + 1,
            h = maxY - minY + 1;
          if (minX === 0 || minY === 0 || maxX === N - 1 || maxY === N - 1)
            continue;
          if (
            area < 0.2 * expectedPx * expectedPx ||
            area > 4 * expectedPx * expectedPx
          )
            continue;
          const aspect = Math.max(w, h) / Math.min(w, h),
            extent = area / (w * h);
          if (aspect > 2.2 || extent < 0.5) continue;
          const cx = sx / area,
            cy = sy / area,
            d = Math.hypot(cx - c0, cy - c0),
            inside = Math.abs(cx - c0) <= bh && Math.abs(cy - c0) <= bh;
          const score = d + (inside ? 0 : 1000);
          if (score < bestScore) {
            bestScore = score;
            bestBlob = { cx, cy, size: Math.sqrt(area), dist: d, inside };
          }
        }
        return bestBlob;
      }
      const Camera = (() => {
        const video = $("#video"),
          guide = $("#guide"),
          gctx = guide.getContext("2d");
        const shutter = $("#shutter"),
          hint = $("#hint");
        const STABLE_FRAMES = 3;
        const N = 64,
          patch = document.createElement("canvas");
        patch.width = patch.height = N;
        const pctx = patch.getContext("2d", { willReadFrequently: true });
        let stream = null,
          timer = null,
          g = null,
          states = ["miss", "miss", "miss", "miss"],
          stable = 0,
          busy = false;
        const COLOR = { match: "#22c55e", near: "#eab308", miss: "#ef4444" };

        function geometry() {
          const cw = guide.clientWidth,
            ch = guide.clientHeight;
          const cm = LAYOUT.corner_markers;
          const refW = cm[1][0] - cm[0][0],
            refH = cm[2][1] - cm[0][1];
          const gw = Math.min(cw * 0.9, (ch * 0.6 * refW) / refH),
            k = gw / refW,
            gh = refH * k;
          const cx = cw / 2,
            cy = Math.min(ch * 0.46, ch - gh / 2 - 130),
            left = cx - gw / 2,
            top = cy - gh / 2;
          const corners = [
            [left, top],
            [left + gw, top],
            [left, top + gh],
            [left + gw, top + gh],
          ];
          const sq = LAYOUT.corner_marker_size * k;
          const R = LAYOUT.capture_region;
          const region = [
            left - (cm[0][0] - R[0]) * k,
            top - (cm[0][1] - R[1]) * k,
            left + gw + (R[2] - cm[1][0]) * k,
            top + gh + (R[3] - cm[2][1]) * k,
          ];
          return {
            cw,
            ch,
            gw,
            gh,
            k,
            left,
            top,
            corners,
            sq,
            box: Math.max(32, sq * 2.8),
            region,
          };
        }
        function coverMap() {
          const vw = video.videoWidth,
            vh = video.videoHeight,
            cw = guide.clientWidth,
            ch = guide.clientHeight;
          if (!vw || !vh) return null;
          const s = Math.max(cw / vw, ch / vh);
          return { s, ox: (cw - vw * s) / 2, oy: (ch - vh * s) / 2 };
        }

        function resize() {
          const dpr = window.devicePixelRatio || 1;
          guide.width = guide.clientWidth * dpr;
          guide.height = guide.clientHeight * dpr;
          gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          g = geometry();
          hint.style.top = Math.min(g.top + g.gh + g.box, g.ch - 150) + "px";
          draw();
        }
        function draw() {
          if (!g) return;
          const { cw, ch } = g;
          gctx.clearRect(0, 0, cw, ch);
          if (!stream) return;
          const pad = g.box * 0.9;
          gctx.fillStyle = "rgba(0,0,0,.45)";
          gctx.beginPath();
          gctx.rect(0, 0, cw, ch);
          gctx.rect(g.left - pad, g.top - pad, g.gw + 2 * pad, g.gh + 2 * pad);
          gctx.fill("evenodd");
          gctx.strokeStyle = "rgba(255,255,255,.35)";
          gctx.lineWidth = 1;
          gctx.strokeRect(g.left, g.top, g.gw, g.gh);
          g.corners.forEach(([x, y], i) => {
            const c = COLOR[states[i]],
              b = g.box;
            gctx.strokeStyle = c;
            gctx.lineWidth = 3;
            gctx.strokeRect(x - b / 2, y - b / 2, b, b);
            gctx.fillStyle = c;
            gctx.fillRect(x - 2, y - 2, 4, 4);
          });
        }

        function evalCorner(i, m) {
          const [sx, sy] = g.corners[i],
            half = g.box * 1.6;
          const vx = (sx - half - m.ox) / m.s,
            vy = (sy - half - m.oy) / m.s,
            vw = (2 * half) / m.s;
          pctx.drawImage(video, vx, vy, vw, vw, 0, 0, N, N);
          const d = pctx.getImageData(0, 0, N, N).data,
            gray = new Uint8Array(N * N);
          for (let p = 0; p < N * N; p++)
            gray[p] =
              (d[p * 4] * 77 + d[p * 4 + 1] * 150 + d[p * 4 + 2] * 29) >> 8;
          const pxPerScreen = N / (2 * half),
            exp = g.sq * pxPerScreen;
          const b = detectSquare(
            gray,
            N,
            Math.max(exp, 2),
            g.box * pxPerScreen,
          );
          if (!b) return "miss";
          const dist = b.dist / pxPerScreen,
            ratio = b.size / Math.max(exp, 1e-6);
          if (b.inside && ratio >= 0.4 && ratio <= 2.5) return "match";
          if (dist <= g.box * 1.0 && ratio >= 0.3 && ratio <= 3.5)
            return "near";
          return "miss";
        }
        function tick() {
          if (busy || !stream || video.readyState < 2 || document.hidden)
            return;
          const m = coverMap();
          if (!m || !g) return;
          try {
            states = [0, 1, 2, 3].map((i) => evalCorner(i, m));
          } catch {
            return;
          }
          const nMatch = states.filter((s) => s === "match").length;
          const nMiss = states.filter((s) => s === "miss").length;
          const canShoot = nMatch >= 2 && nMiss === 0;
          const canAuto = nMatch >= 3 && nMiss === 0;
          stable = canAuto ? stable + 1 : 0;
          shutter.disabled = !canShoot;
          const hasKeys = loadKeys().length > 0;
          hint.textContent = !hasKeys
            ? "Chưa có đáp án - hãy thêm đáp án ở mục “Nhập đáp án” trước khi quét"
            : stable > 0
              ? "Đã khớp - giữ yên, đang tự chụp…"
              : canShoot
                ? "Có thể bấm nút chụp, hoặc căn thêm để tự chụp"
                : nMiss <= 1
                  ? "Gần khớp - giữ yên và căn lại cho chính xác"
                  : "Canh 4 hình vuông ở góc phiếu vào 4 khung";
          draw();
          if (hasKeys && stable >= STABLE_FRAMES) capture();
        }

        async function start() {
          $("#camMsg").hidden = true;
          if (busy || stream) return;
          if (!navigator.mediaDevices?.getUserMedia) {
            return showMsg(
              "Trình duyệt không hỗ trợ camera hoặc trang chưa chạy trên HTTPS.",
            );
          }
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
              },
            });
          } catch (e) {
            stream = null;
            return showMsg(
              e && e.name === "NotAllowedError"
                ? "Bạn chưa cấp quyền camera. Hãy cho phép truy cập camera rồi thử lại."
                : "Không mở được camera. Hãy kiểm tra thiết bị và đảm bảo trang chạy trên HTTPS.",
            );
          }
          if (currentPage !== "scan") {
            stop();
            return;
          }
          video.srcObject = stream;
          await video.play().catch(() => {});
          resize();
          clearInterval(timer);
          timer = setInterval(tick, 160);
        }
        function stop() {
          clearInterval(timer);
          timer = null;
          if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
          }
          video.srcObject = null;
          shutter.disabled = true;
          hint.textContent = "";
          stable = 0;
          states = ["miss", "miss", "miss", "miss"];
        }
        function showMsg(t) {
          $("#camMsgText").textContent = t;
          $("#camMsg").hidden = false;
        }

        // Cắt đúng vùng capture_region từ khung hình gốc rồi gửi lên server
        function grabRegion() {
          const m = coverMap();
          if (!m || !g) return null;
          const [x0, y0, x1, y1] = g.region;
          const sx = (x0 - m.ox) / m.s,
            sy = (y0 - m.oy) / m.s,
            sw = (x1 - x0) / m.s,
            sh = (y1 - y0) / m.s;
          const c = document.createElement("canvas");
          c.width = Math.round(sw);
          c.height = Math.round(sh);
          c.getContext("2d").drawImage(
            video,
            sx,
            sy,
            sw,
            sh,
            0,
            0,
            c.width,
            c.height,
          );
          return new Promise((res) => c.toBlob(res, "image/jpeg", 0.92));
        }

        function setBusy(b) {
          busy = b;
          $("#busy").hidden = !b;
          if (!b) {
            stable = 0;
            shutter.disabled = true;
          } else {
            stop();
            gctx.clearRect(0, 0, guide.clientWidth, guide.clientHeight);
            $("#shutter").hidden = true;
          }
        }

        async function capture() {
          if (busy) return;
          busy = true;
          const blob = await grabRegion();
          if (!blob) {
            busy = false;
            stable = 0;
            return toast("Không chụp được ảnh. Vui lòng thử lại.");
          }
          setBusy(true);
          await submitScan(blob);
        }

        shutter.onclick = async () => {
          if (shutter.disabled || busy) return;
          if (!loadKeys().length) {
            return openModal({
              title: "Chưa có đáp án",
              body: el(
                "p",
                {},
                "Hãy thêm đáp án cho mã đề ở mục “Nhập đáp án” trước khi quét.",
              ),
              actions: [
                { text: "Đóng" },
                {
                  text: "Nhập đáp án",
                  kind: "primary",
                  onClick: () => go("keys"),
                },
              ],
            });
          }
          await capture();
        };
        $("#camRetry").onclick = () => start();
        window.addEventListener("resize", () => {
          if (currentPage === "scan") resize();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else if (currentPage === "scan" && !busy && !$(".modal-wrap"))
            start();
        });
        return { start, stop, setBusy };
      })();

      const resumeScan = () => {
        if (currentPage === "scan") {
          $("#shutter").hidden = false;
          Camera.start();
        }
      };

      async function submitScan(blob) {
        let env = null;
        try {
          const fd = new FormData();
          fd.append("image", blob, "scan.jpg");
          fd.append("answer_keys", JSON.stringify({ exams: loadKeys() }));
          fd.append("mode", "camera");
          const res = await fetch(API_BASE + "/api/scan", {
            method: "POST",
            body: fd,
          });
          env = await res.json();
        } catch {
          Camera.setBusy(false);
          return showScanError("Không kết nối được máy chủ", [
            "Kiểm tra kết nối mạng rồi thử lại.",
          ]);
        }
        Camera.setBusy(false);
        if (!env || !env.success) {
          const err = env && env.error;
          const msgs = (err?.errors || []).map((e) => e.message);
          const needKey = (err?.errors || []).some(
            (e) => e.code === "EXAM_CODE_NOT_IN_ANSWER_KEY",
          );
          return showScanError(
            err?.title || "Không xử lý được phiếu",
            msgs.length ? msgs : ["Đã xảy ra lỗi. Vui lòng thử lại."],
            needKey,
          );
        }
        showScanResult(env.result);
      }
      function showScanError(title, msgs, offerKeys = false) {
        const shown = msgs.slice(0, 5),
          more = msgs.length - shown.length;
        const body = el(
          "ul",
          { class: "errlist" },
          shown.map((m) => el("li", {}, m)),
          more > 0 ? el("li", {}, `… và ${more} lỗi khác`) : null,
        );
        const actions = [];
        if (offerKeys)
          actions.push({ text: "Nhập đáp án", onClick: () => go("keys") });
        actions.push({ text: "Thử lại", kind: "primary" });
        openModal({ title, body, actions, onClose: resumeScan });
      }
      function compactAnswers(res) {
        const out = [];
        for (const [grp, list] of [
          ["MC", res.answers.multiple_choice],
          ["TF", res.answers.true_false],
        ])
          for (const a of list)
            out.push({
              g: grp,
              n: a.question,
              i: a.item,
              e: a.expected,
              d: a.detected,
              r: a.result,
            });
        return out;
      }
      function showScanResult(res) {
        const now = new Date();
        const rec = {
          id:
            now.getTime().toString(36) + Math.random().toString(36).slice(2, 6),
          ts: now.getTime(),
          time: fmtTime(now),
          student_id: res.student.student_id,
          student_raw: res.student.raw,
          exam_code: res.exam.exam_code,
          summary: res.grading.summary,
          scores: res.grading.scores,
          needs_review: res.needs_review,
          answers: compactAnswers(res),
          image: res.images?.grading || null,
        };
        openModal({
          title: "Kết quả quét",
          body: resultView(rec),
          onClose: resumeScan,
          actions: [
            { text: "Hủy" },
            {
              text: "Lưu",
              kind: "primary",
              onClick: () => {
                const all = loadHistory();
                all.push(rec);
                if (!writeLS(LS_HISTORY, all)) return false;
                toast("Đã lưu vào kho lưu trữ.");
              },
            },
          ],
        });
      }

      fetch(API_BASE + "/api/layout")
        .then((r) => r.json())
        .then((j) => {
          if (j && j.layout) LAYOUT = { ...LAYOUT, ...j.layout };
        })
        .catch(() => {})
        .finally(() => go("scan"));
    </script>
  </body>
</html>
